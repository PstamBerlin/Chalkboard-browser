name: APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get the repo
        uses: actions/checkout@v4

      - name: Unpack the project zip
        run: |
          ZIP=$(ls *.zip 2>/dev/null | head -1)
          if [ -z "$ZIP" ]; then
            echo "No .zip found at the top of the repo."
            exit 1
          fi
          unzip -q "$ZIP"
          SETTINGS=$(find . -name settings.gradle.kts -not -path "./.git/*" | head -1)
          echo "PROJECT=$(dirname "$SETTINGS")" >> $GITHUB_ENV

      - name: Use a GeckoView version that actually exists
        working-directory: ${{ env.PROJECT }}
        run: |
          META="https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview/maven-metadata.xml"
          curl -sSL "$META" -o meta.xml
          VER=$(grep -o '<latest>[^<]*</latest>' meta.xml | sed 's/<[^>]*>//g')
          [ -z "$VER" ] && VER=$(grep -o '<release>[^<]*</release>' meta.xml | sed 's/<[^>]*>//g')
          [ -z "$VER" ] && VER=$(grep -o '<version>[^<]*</version>' meta.xml | sed 's/<[^>]*>//g' | tail -1)
          echo "Latest GeckoView is $VER"
          sed -i -E "s|(org\.mozilla\.geckoview:geckoview:)[^\"]+|\1${VER}|" app/build.gradle.kts
          grep -n "geckoview:" app/build.gradle.kts
          echo "GECKO=$VER" >> $GITHUB_ENV
          rm -f meta.xml

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the debug APK
        id: build
        continue-on-error: true
        working-directory: ${{ env.PROJECT }}
        run: |
          set -o pipefail
          gradle wrapper --gradle-version 8.9
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log

      - name: Put the errors on the summary page
        if: always()
        run: |
          {
            echo "## Build result"
            echo ""
            echo "GeckoView version used: ${GECKO:-unknown}"
            echo ""
            if [ "${{ steps.build.outcome }}" = "success" ]; then
              echo "Built fine."
            else
              echo "### Compile errors"
              echo '```'
              grep -E "^e: " /tmp/build.log | head -40 || echo "none found"
              echo '```'
              echo ""
              echo "### Could not find"
              echo '```'
              grep -E "Could not find|Could not resolve|Unresolved reference" /tmp/build.log | sort -u | head -20 || echo "none"
              echo '```'
            fi
          } >> $GITHUB_STEP_SUMMARY

      - name: Upload the APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: chalkboard-apk
          path: ${{ env.PROJECT }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Fail the run if the build failed
        if: steps.build.outcome != 'success'
        run: exit 1
